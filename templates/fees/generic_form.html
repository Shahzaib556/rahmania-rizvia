{% extends "base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:650px;">
  <div class="card-header">{{ title }}</div>
  <div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="row g-3">
      {% for field in form %}
        <div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>
      {% endfor %}
      </div>
      <button class="btn btn-gold mt-3" type="submit"><i class="fa-solid fa-save"></i> Save</button>
      <a href="javascript:history.back()" class="btn btn-outline-secondary mt-3">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
