{% extends "base.html" %}
{% block page_title %}Expenses{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header d-flex justify-content-between"><span>Expenses</span><a href="{% url 'fees:expense_add' %}" class="btn btn-gold btn-sm"><i class="fa-solid fa-plus"></i> Add Expense</a></div>
  <div class="card-body">
    <table class="table table-hover">
      <thead><tr><th>Date</th><th>Title</th><th>Category</th><th>Amount</th></tr></thead>
      <tbody>
      {% for e in expenses %}
        <tr><td>{{ e.date }}</td><td>{{ e.title }}</td><td>{{ e.category }}</td><td>Rs {{ e.amount }}</td></tr>
      {% empty %}<tr><td colspan="4" class="text-center text-muted">No expenses yet.</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
