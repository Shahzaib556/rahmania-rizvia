{% extends "base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
  <div class="card-header">{{ title }}</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
      {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>
      {% endfor %}
      <button class="btn btn-gold" type="submit"><i class="fa-solid fa-save"></i> Save</button>
      <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
