{% extends "base.html" %}
{% block page_title %}Delete Teacher{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
  <div class="card-header">Confirm Delete</div>
  <div class="card-body">
    <p>Delete <strong>{{ object.user.get_full_name }}</strong>?</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger" type="submit">Delete</button>
      <a href="{% url 'teachers:list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
