{% extends "base.html" %}
{% block page_title %}Delete Student{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
  <div class="card-header">Confirm Delete</div>
  <div class="card-body">
    <p>Are you sure you want to delete <strong>{{ object.full_name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Delete</button>
      <a href="{% url 'students:list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
