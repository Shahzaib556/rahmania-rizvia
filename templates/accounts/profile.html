{% extends "base.html" %}
{% block page_title %}My Profile{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header">Update Profile</div>
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="row g-3">
        {% for field in form %}
        <div class="col-md-6">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
      </div>
      <button class="btn btn-gold mt-3" type="submit">Save Changes</button>
      <a href="{% url 'accounts:change_password' %}" class="btn btn-outline-secondary mt-3">Change Password</a>
    </form>
  </div>
</div>
{% endblock %}
