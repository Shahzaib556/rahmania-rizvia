{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Jamia Rahmania Rizvia Sohawa</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card" style="max-width: 800px; width: 100%;">
    <div class="row g-0">
      <div class="col-md-5 brand-side d-none d-md-flex flex-column justify-content-center">
        <i class="fa-solid fa-mosque fa-3x mb-3"></i>
        <p class="mb-1" style="font-family:'Noto Nastaliq Urdu',serif;font-size:1.3rem;">جامعہ رحمانیہ رضویہ سوہاوہ</p>
        <h3>Jamia Rahmania Rizvia Sohawa</h3>
        <p class="mb-0 opacity-75">Management System</p>
      </div>
      <div class="col-md-7 bg-white p-5">
        <h4 class="mb-4">Sign in to your account</h4>
        {% if form.errors %}
          <div class="alert alert-danger py-2">Invalid username or password.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            {{ form.password }}
          </div>
          <button type="submit" class="btn btn-navy w-100">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
